# /etc/systemd/system/bscraft-skins.service.d/sl-entries.conf
# The game server runs on another machine: the skin service fetches SimpleLogin's
# accounts from it whenever it needs them, using a key that can only print that file,
# and keeps the last good copy here.
[Service]
Environment=BSC_SL_ENTRIES=/home/ubuntu/bscraft-skins/data/sl_entries.dat
Environment="BSC_SL_REMOTE=ssh -n -T -i /home/ubuntu/.ssh/bsc_sl_pull -p 25293 -o BatchMode=yes -o ConnectTimeout=6 -o IdentitiesOnly=yes -o UpdateHostKeys=no -o UserKnownHostsFile=/home/ubuntu/bscraft-skins/akariyu_known_hosts -o StrictHostKeyChecking=yes elmer@129.159.19.58"
