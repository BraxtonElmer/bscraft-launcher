server {
    server_name bscraft.zukashix.com;

    root /var/www/bscraft;
    index index.html;

    # Logging
    access_log /var/log/nginx/files_access.log;
    error_log  /var/log/nginx/files_error.log warn;

    # Disable directory listing
    autoindex off;

    # Maximum upload/request size
    client_max_body_size 500M;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Hide nginx version
    server_tokens off;

    # Optional: block backup files
    location ~* \.(bak|old|backup|swp|tmp)$ {
        deny all;
    }

    # Main file serving
    location / {
	add_header Access-Control-Allow-Origin *;
        try_files $uri $uri/ =404;
    }

    location /modpack/files/ {
	add_header Access-Control-Allow-Origin *;
	sendfile on;
	tcp_nopush on;
    }

    # BSCraft skin service (launcher uploads); a localhost-only Python service
    location /api/ {
        proxy_pass http://127.0.0.1:18765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 64k;
        proxy_read_timeout 15s;
    }

    # Published skins in CustomSkinLoader's CustomSkinAPI format
    location /skins/ {
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Textures are named by their sha256, so they never change
    location /skins/textures/ {
        default_type image/png;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/bscraft.zukashix.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bscraft.zukashix.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = bscraft.zukashix.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name bscraft.zukashix.com;
    return 404; # managed by Certbot


}
