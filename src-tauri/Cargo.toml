[package]
name = "bscraft-launcher"
version = "1.1.5"
description = "BSCraft Launcher"
authors = ["BSCraft"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bscraft_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async HTTP with streaming support
reqwest = { version = "0.12", features = ["stream", "json"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# Crypto — SHA-256 for file integrity checks
sha2 = "0.10"
hex = "0.4"

# Base64 — decoding Mojang profile textures
base64 = "0.22"

# System info — RAM detection
sysinfo = "0.31"

# Archive extraction — JRE zip (Windows) and tar.gz (macOS)
zip = "2"
tar = "0.4"
flate2 = "1"

# Semver — version comparison for update checks
semver = "1"

# MD5 — offline UUID generation (Minecraft standard)
md5 = "0.7"

# Platform directories — %APPDATA% / ~/Library/Application Support resolution
dirs = "5"

# Windows GPU detection and preference
[target.'cfg(windows)'.dependencies]
wmi = "0.13"
winreg = "0.52"

# macOS: centring the window, and moving the app to the Trash on uninstall
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }
